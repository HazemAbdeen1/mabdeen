<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دهانات عابدين - معمل الشام للكيماويات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; text-align: center; padding: 30px; color: #264765; margin: 0; }
        .card { background: white; max-width: 520px; margin: 0 auto; padding: 30px; border-radius: 10px; border: 1px solid #C0C0C0; box-shadow: 0 4px 10px rgba(38,71,101,0.1); }
        h2 { color: #264765; margin-bottom: 5px; font-size: 22px; }
        .subtitle { font-size: 13px; color: #349bca; font-weight: bold; margin-bottom: 15px; }
        hr { width: 60%; border: 1px solid #349bca; margin-bottom: 20px; }
        .info { font-size: 15px; margin: 10px 0; text-align: right; background: #f8f9fa; padding: 10px 15px; border-radius: 6px; border-right: 4px solid #349bca; }
        .box { margin-top: 20px; background: #f4f7f6; padding: 20px; border-radius: 8px; text-align: right; border: 1px solid #e2e8f0; }
        input, select { padding: 12px; width: 100%; margin-bottom: 15px; border: 1px solid #C0C0C0; border-radius: 6px; box-sizing: border-box; font-family: Tahoma, sans-serif; font-size: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #264765; }
        .note { font-size: 12px; color: #c0392b; margin-bottom: 12px; font-weight: bold; line-height: 1.5; }
        button { background: #349bca; color: white; border: none; padding: 14px 25px; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 16px; width: 100%; transition: background 0.3s; }
        button:hover { background: #264765; }
        .result-box { padding: 25px; border-radius: 8px; margin-top: 20px; font-size: 16px; font-weight: bold; line-height: 1.6; }
        .winner { background: #dff0d8; color: #3c763d; border: 1px solid #d6e9c6; }
        .loser { background: #fcf8e3; color: #8a6d3b; border: 1px solid #faebcc; }
        .footer-brand { margin-top: 25px; font-size: 12px; color: #7f8c8d; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <h2>مصطفى عابدين وشركاه</h2>
        <div class="subtitle">معمل الشام للكيماويات - عراقة جودة الدهانات منذ 1954</div>
        <hr>
        <p class="info"><b>المنتج المكتشف:</b> <span id="productName">جاري التحميل...</span></p>

        <div class="box" id="formBox">
            <p style="font-weight: bold; margin-bottom: 15px; text-align: center; color: #264765;">سجل رقم هاتفك لتكون معنا في السحوبات والجوائز الفورية:</p>

            <label>رقم الهاتف الأساسي:</label>
            <input type="text" id="phoneInput" placeholder="09xxxxxxxx" maxlength="10" oninput="checkPhoneRegistration()">
            <div class="note">⚠️ يجب أن يتكون رقم الهاتف من 10 أرقام ويبدأ بـ 09 حصراً.</div>

            <div id="extraFields">
                <label>الاسم الكامل:</label>
                <input type="text" id="nameInput" placeholder="ادخل اسمك الكامل...">

                <label>المدينة:</label>
                <select id="cityInput">
                    <option value="">اختر المدينة...</option>
                    <option value="دمشق">دمشق</option>
                    <option value="ريف دمشق">ريف دمشق</option>
                    <option value="حلب">حلب</option>
                    <option value="حمص">حمص</option>
                    <option value="حماة">حماة</option>
                    <option value="اللاذقية">اللاذقية</option>
                    <option value="طرطوس">طرطوس</option>
                    <option value="درعا">درعا</option>
                    <option value="السويداء">السويداء</option>
                    <option value="القنيطرة">القنيطرة</option>
                    <option value="إدلب">إدلب</option>
                    <option value="دير الزور">دير الزور</option>
                    <option value="الرقة">الرقة</option>
                    <option value="الحسكة">الحسكة</option>
                </select>

                <label>الصفة:</label>
                <select id="roleInput">
                    <option value="مقاول دهان">مقاول دهان</option>
                    <option value="صاحب منزل">صاحب منزل</option>
                    <option value="مهندس">مهندس</option>
                </select>
            </div>

            <button onclick="claimCode()">تأكيد الكود والحصول على الهدية</button>
        </div>

        <div class="footer-brand">
            <b>دهانات عابدين</b> - الجودة التي تليق بثقتكم
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
const SERVER_URL = 'https://api.mabdeen.com';
        if (!token) {
            document.getElementById('mainCard').innerHTML = '<h3 style="color: #d9534f;">رابط غير صالح، يرجى مسح كود الـ QR بشكل صحيح من العبوة</h3>';
        } else {
            fetch(`${SERVER_URL}/api/code-details?token=${token}`)
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        document.getElementById('mainCard').innerHTML = `<h3 style="color: #d9534f;">${data.error}</h3>`;
                    } else {
                        document.getElementById('productName').innerText = `${data.code.product_name} (${data.code.brand})`;
                    }
                })
                .catch(err => {
                    document.getElementById('mainCard').innerHTML = '<h3 style="color: #d9534f;">خطأ في الاتصال بالخادم، يرجى المحاولة لاحقاً</h3>';
                });
        }

        async function checkPhoneRegistration() {
            const phone = document.getElementById('phoneInput').value.trim();
            const extraFields = document.getElementById('extraFields');

            if (phone.length < 10) {
                extraFields.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${SERVER_URL}/api/check-user?phone=${phone}`);
                const data = await res.json();
                
                if (data.exists) {
                    extraFields.style.display = 'none';
                } else {
                    extraFields.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function claimCode() {
            const phone = document.getElementById('phoneInput').value.trim();
            
            const phoneRegex = /^09\d{8}$/;
            if (!phoneRegex.test(phone)) {
                alert('الرجاء إدخال رقم هاتف صحيح يتكون من 10 أرقام ويبدأ بـ 09');
                return;
            }

            const extraVisible = document.getElementById('extraFields').style.display !== 'none';
            const name = extraVisible ? document.getElementById('nameInput').value.trim() : '';
            const city = extraVisible ? document.getElementById('cityInput').value : '';
            const role = document.getElementById('roleInput').value;

            if (extraVisible && (!name || !city)) {
                alert('الرجاء إدخال الاسم الكامل واختيار المدينة من القائمة');
                return;
            }

            try {
                const res = await fetch(`${SERVER_URL}/api/process-scan`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token, name, phone: city ? `${phone} (${city})` : phone, role })
                });
                const data = await res.json();

                if (data.error) {
                    alert(data.error);
                    return;
                }

                const card = document.getElementById('mainCard');
                const boxClass = data.isWinner ? 'winner' : 'loser';
                card.innerHTML = `
                    <h2>مصطفى عابدين وشركاه</h2>
                    <div class="subtitle">معمل الشام للكيماويات</div>
                    <hr>
                    <div class="result-box ${boxClass}">
                        <p>${data.message}</p>
                    </div>
                    <p style="margin-top: 20px; font-size: 13px; color: #555;">شكراً لثقتكم بمنتجاتنا الأصلية.</p>
                `;
            } catch (err) {
                alert('حدث خطأ في الاتصال بالخادم');
            }
        }
    </script>
</body>
</html>
