<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية - دهانات عابدين</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; padding: 20px; color: #264765; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; border: 1px solid #C0C0C0; box-shadow: 0 4px 10px rgba(38,71,101,0.1); }
        h2 { color: #264765; border-bottom: 2px solid #349bca; padding-bottom: 10px; margin-top: 0; }
        .section { margin-bottom: 25px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        input, select { padding: 10px; width: 100%; margin-bottom: 10px; border: 1px solid #C0C0C0; border-radius: 6px; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        button { background: #349bca; color: white; border: none; padding: 12px 20px; font-weight: bold; cursor: pointer; border-radius: 6px; width: 100%; transition: background 0.3s; }
        button:hover { background: #264765; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #264765; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>لوحة تحكم معمل الشام للكيماويات</h2>

        <!-- قسم توليد الأكواد -->
        <div class="section">
            <h3>توليد أكواد QR جديدة</h3>
            <label>اسم المنتج:</label>
            <input type="text" id="productName" placeholder="مثال: أساس بلاستيك مائي">
            
            <label>العلامة التجارية:</label>
            <select id="brand">
                <option value="AL FIRDOSS">AL FIRDOSS</option>
                <option value="AL OFOK">AL OFOK</option>
                <option value="Junior">Junior</option>
                <option value="Maf chique">Maf chique</option>
            </select>

            <label>العدد المطلوب توليده:</label>
            <input type="number" id="count" value="10">

            <button onclick="generateCodes()">توليد الأكواد الآن</button>
        </div>

        <!-- قسم الإحصائيات والأكواد -->
        <div class="section">
            <h3>الأكواد المسجلة والنشطة</h3>
            <button onclick="loadDashboardData()" style="width: auto; margin-bottom: 15px; background: #264765;">تحديث البيانات</button>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>الكود (Token)</th>
                            <th>المنتج</th>
                            <th>العلامة</th>
                            <th>الحالة</th>
                            <th>رقم الهاتف المسجل</th>
                        </tr>
                    كنولوجية
                    <tbody id="codesTable">
                        <tr><td colspan="5">انقر على تحديث البيانات لعرض السجلات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // رابط النفق الآمن الخاص بسيرفرك (يتم تحديثه عند تشغيل cloudflared)
        const SERVER_URL = 'https://secretary-admit-slowly-tear.trycloudflare.com';

        async function generateCodes() {
            const product_name = document.getElementById('productName').value.trim();
            const brand = document.getElementById('brand').value;
            const count = document.getElementById('count').value;

            if (!product_name) {
                alert('الرجاء إدخال اسم المنتج');
                return;
            }

            try {
                const res = await fetch(`${SERVER_URL}/api/admin/generate`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ product_name, brand, count })
                });
                const data = await res.json();
                if (data.success) {
                    alert(`تم توليد ${count} كود بنجاح!`);
                    loadDashboardData();
                } else {
                    alert('خطأ أثناء التوليد');
                }
            } catch (err) {
                alert('فشل الاتصال بالسيرفر');
            }
        }

        async function loadDashboardData() {
            try {
                const res = await fetch(`${SERVER_URL}/api/admin/codes`);
                const codes = await res.json();
                const tbody = document.getElementById('codesTable');
                tbody.innerHTML = '';

                if (codes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">لا توجد أكواد مسجلة بعد</td></tr>';
                    return;
                }

                codes.forEach(c => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${c.token}</td>
                            <td>${c.product_name}</td>
                            <td>${c.brand}</td>
                            <td>${c.is_used ? 'مستخدم' : 'جديد'}</td>
                            <td>${c.user_phone || '-'}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
