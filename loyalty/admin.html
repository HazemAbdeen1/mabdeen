<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول - معمل الشام للكيماويات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #264765; }
        .card { background: white; padding: 30px; border-radius: 10px; border: 1px solid #C0C0C0; box-shadow: 0 4px 10px rgba(38,71,101,0.1); text-align: center; max-width: 400px; width: 100%; }
        h2 { color: #264765; margin-top: 0; border-bottom: 2px solid #349bca; padding-bottom: 10px; }
        p { color: #666; font-size: 14px; }
        .btn { display: inline-block; background: #349bca; color: white; text-decoration: none; padding: 12px 25px; font-weight: bold; border-radius: 6px; margin-top: 20px; transition: background 0.3s; width: 100%; box-sizing: border-box; }
        .btn:hover { background: #264765; }
    </style>
</head>
<body>
    <div class="card">
        <h2>لوحة تحكم السيرفر</h2>
        <p>انقر أدناه للاتصال المباشر والدخول إلى نظام إدارة الأكواد على سيرفرك:</p>
        <a href="#" id="serverLink" class="btn">الانتقال إلى لوحة السيرفر</a>
    </div>

    <script>
        // ضع هنا رابط السيرفر الخاص بك (الـ IP مع البورت أو الرابط الحالي النشط للسيرفر)
        const SERVER_URL = 'http://23.27.186.206:3000'; // أو رابط السيرفر المباشر لديك
        
        document.getElementById('serverLink').href = SERVER_URL;
    </script>
</body>
</html>
